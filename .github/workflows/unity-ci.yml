name: Unity CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-and-build:
    name: Run Tests and Build 🧪🏗️
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Cache Unity dependencies to speed up builds
      - name: Cache Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('**/Packages/manifest.json') }}
          restore-keys: |
            Library-${{ runner.os }}-

      # 3️⃣ Run Unity tests (EditMode + PlayMode)
      - name: Run Unity Tests
        uses: game-ci/unity-test-runner@v3
        with:
          unityVersion: 2022.3.10f1
          testMode: all

      # 4️⃣ Build the project (for Windows)
      - name: Build Unity Project
        uses: game-ci/unity-builder@v3
        with:
          unityVersion: 2022.3.10f1
          targetPlatform: StandaloneWindows64

      # 5️⃣ Upload the build as an artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Build
          path: build
